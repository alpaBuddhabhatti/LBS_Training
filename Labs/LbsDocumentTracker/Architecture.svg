<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1400 1040">
  <title>LBS fictional document processing: current local demo and proposed Azure integration</title>
  <desc>Solid arrows show implemented in-memory processing. Dashed arrows show planned Azure integration using existing Training resources. No cloud deployment is performed by this diagram.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315c79"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #17364d; font-size: 18px; }
      .title { font-size: 29px; font-weight: bold; }
      .heading { font-size: 22px; font-weight: bold; }
      .small { font-size: 16px; }
      .box { fill: #edf5fc; stroke: #315c79; stroke-width: 2; rx: 12; }
      .planned { fill: #fff8e8; stroke: #947026; stroke-width: 2; stroke-dasharray: 8 5; rx: 12; }
      .flow { fill: none; stroke: #315c79; stroke-width: 2; marker-end: url(#arrow); }
      .future { fill: none; stroke: #315c79; stroke-width: 2; stroke-dasharray: 8 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="1040" fill="white"/>
  <text x="35" y="45" class="title">Fictional application document processing</text>
  <text x="35" y="76">Training scenario | Solid = implemented locally | Dashed = proposed integration, not deployed</text>
  <rect x="25" y="105" width="1350" height="245" rx="15" fill="#f5f8fb" stroke="#b2c7d7"/>
  <text x="45" y="138" class="heading">Current code: Development only, localhost, no authentication or persistence</text>
  <rect x="45" y="165" width="230" height="95" class="box"/>
  <text x="62" y="196">Browser + fictional file</text>
  <text x="62" y="226" class="small">UTF-8 text, max 32 KiB</text>
  <rect x="335" y="165" width="265" height="95" class="box"/>
  <text x="350" y="196">Razor website / upload</text>
  <text x="350" y="226" class="small">Reference and file checks</text>
  <rect x="665" y="165" width="270" height="95" class="box"/>
  <text x="680" y="196">Bounded in-memory queue</text>
  <text x="680" y="226" class="small">Background validation worker</text>
  <rect x="995" y="165" width="355" height="95" class="box"/>
  <text x="1010" y="194">In-memory status dashboard</text>
  <text x="1010" y="222" class="small">Completed / Needs review / Failed</text>
  <path d="M275 210 H335" class="flow"/><path d="M600 210 H665" class="flow"/><path d="M935 210 H995" class="flow"/>
  <text x="45" y="302">All local records disappear on shutdown. No real customer data. Completed is not financial approval.</text>
  <rect x="25" y="380" width="1350" height="485" rx="15" fill="#fffdfa" stroke="#d8c494"/>
  <text x="45" y="416" class="heading">Azure target: reuse Training resources after access and deployment approval</text>
  <rect x="45" y="450" width="270" height="110" class="planned"/>
  <text x="60" y="481">Staff + Entra sign-in</text>
  <text x="60" y="510" class="small">Authentication + app access</text>
  <text x="60" y="537" class="small">Not implemented yet</text>
  <rect x="380" y="450" width="330" height="110" class="planned"/>
  <text x="395" y="481">Website / API</text>
  <text x="395" y="510" class="small">Local first; no Azure web app yet</text>
  <text x="395" y="537" class="small">App Service plan is not a web app</text>
  <rect x="780" y="450" width="560" height="110" class="planned"/>
  <text x="795" y="481">SQL: firstsqlserver2026 / firstdb | Central US</text>
  <text x="795" y="510" class="small">Metadata, status and durable dispatch/outbox (to implement)</text>
  <text x="795" y="537" class="small">Public access disabled: approved private route required</text>
  <path d="M315 505 H380" class="future"/><path d="M710 505 H780" class="future"/>
  <rect x="45" y="620" width="380" height="115" class="planned"/>
  <text x="60" y="651">Private Blob document storage</text>
  <text x="60" y="680" class="small">stordemo2026 (East US) or</text>
  <text x="60" y="708" class="small">traininga8a2 (UK South): confirm host use</text>
  <rect x="485" y="620" width="365" height="115" class="planned"/>
  <text x="500" y="651">fristAzureServiceBus | UK South</text>
  <text x="500" y="680" class="small">Basic namespace; no queues currently</text>
  <text x="500" y="708" class="small">Queue + retries + DLQ to configure</text>
  <rect x="910" y="620" width="430" height="115" class="planned"/>
  <text x="925" y="651">fristAzureFunctionApp | UK South</text>
  <text x="925" y="680" class="small">Existing .NET 8 isolated runtime</text>
  <text x="925" y="708" class="small">Worker + managed identity to implement</text>
  <path d="M470 560 V590 H235 V620" class="future"/>
  <path d="M600 560 V590 H665 V620" class="future"/>
  <path d="M850 675 H910" class="future"/>
  <path d="M1120 620 V560" class="future"/>
  <text x="45" y="788">API and worker telemetry -&gt; existing Application Insights -&gt; linked Log Analytics -&gt; KQL / alerts</text>
  <text x="45" y="822" class="small">Managed identities + scoped data roles; SQL contained users; network routes; per-user authorisation: all required.</text>
  <text x="35" y="910" class="heading">Before cloud integration</text>
  <text x="35" y="945">Check existing Function code before deployment. Never overwrite it without approval.</text>
  <text x="35" y="977">Cross-region services add latency / possible transfer costs. Do not relocate or enable SQL public access silently.</text>
  <text x="35" y="1009">Reliability target: durable dispatch, idempotent processing, visible errors and dead-letter recovery.</text>
</svg>
